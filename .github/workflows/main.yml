name: MERN Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering from GitHub UI

env:
  DOCKER_USERNAME: gdfa95713

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      client_changed: ${{ steps.filter.outputs.client }}
      server_changed: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  build_and_push_client:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.client_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/thread-client:latest
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/thread-client:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/thread-client:buildcache,mode=max

  build_and_push_server:
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.server_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/thread-server:latest
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/thread-server:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/thread-server:buildcache,mode=max

  deploy:
    needs: [build_and_push_client, build_and_push_server]
    if: always() && (needs.build_and_push_client.result == 'success' || needs.build_and_push_server.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: dema
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/dema/app
            # Enable error handling - fail on first error
            set -e

            # Pull only the images that were built in this workflow
            if [ "${{ needs.build_and_push_client.result }}" == "success" ]; then
              docker compose pull client
            fi
            if [ "${{ needs.build_and_push_server.result }}" == "success" ]; then
              docker compose pull server
            fi

            # Recreate only the services that were updated
            SERVICES_TO_RECREATE=""
            if [ "${{ needs.build_and_push_client.result }}" == "success" ]; then
              SERVICES_TO_RECREATE="$SERVICES_TO_RECREATE client"
            fi
            if [ "${{ needs.build_and_push_server.result }}" == "success" ]; then
              SERVICES_TO_RECREATE="$SERVICES_TO_RECREATE server"
            fi

            if [ -n "$SERVICES_TO_RECREATE" ]; then
              docker compose up -d --force-recreate $SERVICES_TO_RECREATE
            fi

            # Clean up old images
            docker image prune -f

            echo "Deployment completed successfully!"
            echo "Services updated: $SERVICES_TO_RECREATE"
            docker compose ps

            # Verify services are healthy
            echo "Verifying service health..."
            sleep 10  # Give containers time to start
            if docker compose exec server curl -f http://localhost:8000/api/health; then
              echo "✅ Server is healthy"
            else
              echo "❌ Server health check failed"
              exit 1
            fi
