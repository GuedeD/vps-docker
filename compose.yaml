version: "3.8"
services:
  client:
    image: gdfa95713/thread-client:latest
    restart: unless-stopped
    depends_on:
      - server

  server:
    image: gdfa95713/thread-server:latest
    environment:
      MONGODB_URI: mongodb://mongo:27017/threadDB
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl # For SSL certificates later
    restart: unless-stopped
    depends_on:
      - client
      - server

volumes:
  mongo-data:
